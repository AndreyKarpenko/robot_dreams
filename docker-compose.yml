services:
  db:
    image: postgres:16-alpine
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: shop
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # db/ is mounted read-only so schema/seed/index scripts run with -f /db/...
      - ./db:/db:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d shop']
      interval: 2s
      timeout: 2s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer
    ports:
      - '6432:5432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U admin']
      interval: 2s
      timeout: 2s
      retries: 15
