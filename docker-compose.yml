services:
    api:
        depends_on:
            postgres:
                condition: service_healthy
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
            POSTGRES_DB: ${POSTGRES_DB:-robot_dream}
            POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
            POSTGRES_PORT: ${POSTGRES_PORT:-5432}
            API_PORT: ${API_PORT:-3000}
        ports:
            - '${API_PORT:-3000}:${API_PORT:-3000}'
        networks:
            - robot_dream

    postgres:
        image: postgres:17
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-robot_dream}']
            interval: 10s
            timeout: 5s
            retries: 5
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
            POSTGRES_DB: ${POSTGRES_DB:-robot_dream}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - robot_dream

volumes:
    postgres_data:

networks:
    robot_dream:
