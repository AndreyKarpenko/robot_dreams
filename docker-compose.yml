services:
  db:
    image: postgres:16-alpine
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: shop
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # db/ is mounted read-only so schema/seed/index scripts run with -f /db/...
      - ./db:/db:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d shop']
      interval: 2s
      timeout: 2s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer
    ports:
      - '6432:5432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U admin']
      interval: 2s
      timeout: 2s
      retries: 15

  # Cache may evict. Queue, sessions, and rate limits must not: maxmemory-policy
  # is per process, so SELECT does not split these two.
  redis-cache:
    image: redis:8-alpine
    ports:
      - '16379:6379'
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  redis-queue:
    image: redis:8-alpine
    ports:
      - '16380:6379'
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - ''
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  pact-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact_broker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pact -d pact_broker']
      interval: 2s
      timeout: 2s
      retries: 15

  pact-broker:
    image: pactfoundation/pact-broker:latest
    ports:
      - '9292:9292'
    depends_on:
      pact-db:
        condition: service_healthy
    environment:
      PACT_BROKER_PORT: '9292'
      PACT_BROKER_DATABASE_URL: postgres://pact:pact@pact-db:5432/pact_broker
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: '10'
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_BROKER_PUBLIC_HEARTBEAT: 'true'
      PACT_BROKER_BASE_URL: >-
        http://127.0.0.1:9292 http://localhost:9292 http://pact-broker:9292
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost can be ::1,
      # and puma listens on IPv4 only.
      test:
        [
          'CMD-SHELL',
          'wget -q --tries=1 --spider http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
