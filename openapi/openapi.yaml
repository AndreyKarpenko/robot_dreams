openapi: "3.0.3"
info:
  title: Marketplace API
  version: "1.0.0"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /
security: [ ]
paths:
  /products:
    get:
      operationId: listProducts
      summary: List products with cursor pagination
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque position token. The client must not interpret it and should pass next_cursor as-is.
          schema:
            $ref: "#/components/schemas/Cursor"
      responses:
        "200":
          description: A page of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /products/{id}:
    get:
      operationId: getProduct
      summary: Get a product by id
      parameters:
        - name: id
          in: path
          required: true
          description: Product id.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /orders:
    get:
      operationId: listOrders
      summary: List orders with cursor pagination
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque position token. The client must not interpret it and should pass next_cursor as-is.
          schema:
            $ref: "#/components/schemas/Cursor"
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createOrder
      summary: Create an order
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Clients retry safely: the same Idempotency-Key with the same
            request body returns the original 201 create response (with
            Idempotency-Replay: true on replay) instead of creating another
            order. The same key with a different body is rejected with 422.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order created, or a replay of the original create
          headers:
            Idempotency-Replay:
              description: >
                Set to true when this is a replay of a previous successful
                create with the same Idempotency-Key and body.
              schema:
                type: string
                enum:
                  - "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: A product in the order does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Idempotency-Key reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order by id
      parameters:
        - name: id
          in: path
          required: true
          description: Order id.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Cursor:
      type: string
      minLength: 1
      pattern: "^[0-9]+$"
      description: Opaque position token issued by this API. Pass next_cursor as-is.
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - price_cents
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
        price_cents:
          type: integer
          minimum: 0
          description: Price in cents.
    ProductList:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: string
          nullable: true
          minLength: 1
          pattern: "^[0-9]+$"
          description: Token for the next page. null means there are no more pages.
    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - items
        - total_cents
      properties:
        id:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - created
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        total_cents:
          type: integer
          minimum: 0
          description: Order total in cents.
    OrderList:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        next_cursor:
          type: string
          nullable: true
          minLength: 1
          pattern: "^[0-9]+$"
          description: Token for the next page. null means there are no more pages.
    OrderItem:
      type: object
      additionalProperties: false
      required:
        - product_id
        - quantity
        - price_cents
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
        price_cents:
          type: integer
          minimum: 0
          description: Product price in cents at order time.
    CreateOrderItem:
      type: object
      additionalProperties: false
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
    CreateOrder:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOrderItem"
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          description: URI of the error type.
        title:
          type: string
          description: Short error name.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: What went wrong.
        instance:
          type: string
          description: URI of this specific occurrence.

